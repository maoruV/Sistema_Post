{% extends 'layouts/base.html' %}
{% block title %}Eliminar Factura{% endblock %}
{% block content %}
<div class="delete-modal animate-fade-in-up mt-12">
    <div class="w-14 h-14 rounded-full bg-[var(--danger-light)] flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-[var(--danger)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
    </div>
    <h2 class="text-lg font-[var(--font-heading)] font-bold mb-2">¿Eliminar factura?</h2>
    <p class="text-sm text-[var(--text-secondary)] mb-6">Factura <strong class="text-[var(--text-primary)]">{{ invoice.invoice_number }}</strong> de {{ invoice.supplier.name }}.</p>
    <form method="post" class="flex justify-center gap-3">
        {% csrf_token %}
        <a href="{% url 'suppliers:invoice_list' %}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-danger">Eliminar</button>
    </form>
</div>
{% endblock %}
